{{- /* 首页随机名言：从一言 (hitokoto.cn) 拉取诗词/哲学类句子；请求失败时保留 config.toml 里的原欢迎语 */ -}}
{{- if .IsHome }}
<script>
(function () {
    var box = document.querySelector(".home-info .entry-content");
    if (!box || !window.fetch) return;
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = ctrl && setTimeout(function () { ctrl.abort(); }, 3000);
    fetch("https://v1.hitokoto.cn/?c=i&c=k&max_length=50&encode=json", ctrl ? { signal: ctrl.signal } : {})
        .then(function (r) { return r.json(); })
        .then(function (q) {
            if (!q || !q.hitokoto) return;
            var text = document.createElement("p");
            text.className = "quote-text";
            text.textContent = q.hitokoto;
            var author = document.createElement("p");
            author.className = "quote-author";
            author.textContent = "—— " + (q.from_who ? q.from_who + " · " : "") + (q.from ? "「" + q.from + "」" : "");
            box.replaceChildren(text, author);
            box.classList.add("quote-ready");
        })
        .catch(function () {})
        .finally(function () { if (timer) clearTimeout(timer); });
})();
</script>
{{- end }}
